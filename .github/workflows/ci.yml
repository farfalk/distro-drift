name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        env:
          SHELLCHECK_OPTS: -x
        with:
          scandir: '.'
          additional_files: 'distro-drift'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run tests
        run: bats tests/

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install optional companions
        run: sudo apt-get update && sudo apt-get install -y debsums
      - name: Full run as root on a real Ubuntu system
        run: sudo ./distro-drift --quick > report.txt
      - name: Report is non-trivial
        run: |
          test "$(wc -l < report.txt)" -gt 40
          grep -q "Third-party software sources" report.txt
      - name: Save a snapshot (written mode 0640 since 1.3.0)
        run: sudo ./distro-drift --save > /dev/null
      - name: New snapshots are group-readable, not world-readable
        run: |
          f=$(ls -t /var/lib/distro-drift/*.txt | head -1)
          [ "$(stat -c %a "$f")" = "640" ]
      - name: --snapshots --json is valid JSON (no root needed)
        run: |
          python3 --version
          ./distro-drift --snapshots --json > snaps.json
          python3 -m json.tool < snaps.json > /dev/null
          grep -q '"ref":"@0"' snaps.json
      - name: --diff --json is valid JSON (no root needed)
        run: |
          ./distro-drift --diff @0 @0 --json > diff.json
          python3 -m json.tool < diff.json > /dev/null
          grep -q '"identical":true' diff.json
      - uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: report.txt
